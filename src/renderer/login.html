<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>CashPOS – Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="./css/styles.css"/>
</head>
<body class="lp">
  <div class="login-splash" id="loginSplash" aria-label="Loading CashPOS">
    <div class="login-splash-inner">
      <img src="./assets/logo/gcashloading.png" class="login-splash-logo" alt="CashPOS loading"/>
      <div class="login-spinner" aria-hidden="true"></div>
    </div>
  </div>
  <div class="lp-wrap">
    <div class="lp-card">
      <div class="lp-logo">
        <img src="./assets/logo/gcashlogo.png" class="lp-img" alt="CashPOS logo"/>
        <p class="lp-sub">POS Transaction Record System</p>
      </div>
      <h2 class="lp-title">Sign in to your account</h2>

      <form id="loginForm">
        <div class="lp-fg">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" placeholder="Enter username" autocomplete="username" required/>
        </div>
        <div class="lp-fg">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Enter password" autocomplete="current-password" required/>
        </div>
        <div class="lp-fg lp-role-select">
          <label for="loginRole">Continue as</label>
          <select id="loginRole" name="role">
            <option value="admin">Administrator</option>
            <option value="staff">Staff</option>
          </select>
        </div>
        <label class="lp-rem">
          <input id="remember" name="remember" type="checkbox"/> Remember me
        </label>
        <button type="submit" class="lp-btn">Sign in</button>
        <div class="lp-err" id="loginErr"></div>
      </form>
    </div>
  </div>
  <script src="./js/app.js"></script>
  <script src="./js/updates.js"></script>
</body>
</html>
